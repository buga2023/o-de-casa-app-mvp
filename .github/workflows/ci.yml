# CI — build + testes unitários + E2E a cada push/PR (P1.7)
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

      - name: Testes unitários (BR-01..09)
        run: npm run test:unit

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes E2E (caminho-feliz + caminhos-tristes)
        run: npx playwright test

      - name: Artefatos do Playwright (em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
